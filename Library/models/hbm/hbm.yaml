source_notes:
  organization: Micron public HBM3E material describes 16 channels and 32 pseudo-channels per placement.
  capacity: The 24 GB per-partition value matches a public 8-high HBM3E capacity point.
  bandwidth: The 625 GB/s cap is the Overflow architecture allocation, not the physical stack ceiling.
  dram_timing: Command-cycle values are configurable simulation assumptions, not vendor timing-bin data.
  source_url: https://www.micron.com/products/memory/hbm/hbm3e
